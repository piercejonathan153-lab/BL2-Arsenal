<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BL2 Arsenal Launcher</title>
<style>
  :root {
    --glass: rgba(16, 18, 24, .78); --glass2: rgba(34, 38, 47, .82); --line: rgba(255,255,255,.09);
    --text: #eef0f3; --muted: #a3aab6; --accent: #f7b20a; --accent2: #ff8a00; --accent-ink: #1a1000;
    --good: #6fdc84; --bad: #ff6f61; --warn: #f7b20a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); background: #0b0d11;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { background: url({{BG}}) center 40% / cover no-repeat, #0b0d11; }
  .app { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%;
    background: linear-gradient(90deg, rgba(8,10,14,.92) 0%, rgba(8,10,14,.78) 38%, rgba(8,10,14,.25) 70%, rgba(8,10,14,.55) 100%); }
  .main { padding: 18px 26px 16px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .logo { width: min(380px, 100%); height: auto; display: block; margin: 0 0 2px -6px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  .tag { color: #d3d7de; text-shadow: 0 1px 3px #000; font-size: 13.5px; }
  .status { margin: 14px 0 0; background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); max-width: 560px; }
  .row { display: grid; grid-template-columns: 18px 118px minmax(0, 1fr); align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .row .k { color: var(--muted); }
  .row .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .v a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .actions { display: flex; gap: 10px; margin-top: 16px; align-items: stretch; }
  button { font: inherit; color: var(--text); background: var(--glass2); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  button:hover:not(:disabled) { border-color: rgba(255,255,255,.28); background: rgba(52,58,70,.9); }
  button:disabled { opacity: .45; cursor: default; }
  .play { font-family: Bahnschrift, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent2)); color: var(--accent-ink); border: 0;
    padding: 12px 46px; box-shadow: 0 6px 20px rgba(247,140,10,.35); }
  .play:hover:not(:disabled) { background: linear-gradient(180deg, #ffc533, #ff9a1f); }
  .primary { font-weight: 600; padding: 12px 20px; }
  .primary.hot { border-color: var(--accent); color: var(--accent); }
  .progress { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 10px; overflow: hidden;
    visibility: hidden; max-width: 560px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .more { margin-top: auto; display: flex; flex-wrap: wrap; gap: 7px; padding-top: 12px; }
  .more button { padding: 6px 11px; font-size: 12.5px; }
  .more .danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .side { background: rgba(10,12,16,.66); border-left: 1px solid var(--line); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; min-height: 0; }
  .side h3 { margin: 0; padding: 14px 18px 6px; font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .notes { padding: 0 18px 8px; flex: 0 1 auto; max-height: 48%; overflow: auto; font-size: 13px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .ver { color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  .log { flex: 1 1 0; min-height: 60px; margin: 0 12px 8px; padding: 8px 10px; background: rgba(0,0,0,.45);
    border: 1px solid var(--line); border-radius: 8px; overflow: auto; font: 12px/1.5 Consolas, monospace;
    color: #cfd4dc; user-select: text; }
  .log div { white-space: pre-wrap; }
  .foot { padding: 4px 18px 10px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .foot a { color: var(--muted); cursor: pointer; } .foot a:hover { color: var(--accent); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <img class="logo" src="{{LOGO}}" alt="BL2 Arsenal">
    <div class="tag">140 Borderlands 2 guns, shields and grenades for The Pre-Sequel</div>

    <div class="status">
      <div class="row"><i class="dot" id="d-tps"></i><span class="k">Pre-Sequel</span><span class="v" id="v-tps">Looking...</span></div>
      <div class="row"><i class="dot" id="d-sdk"></i><span class="k">Mod manager</span><span class="v" id="v-sdk"></span></div>
      <div class="row"><i class="dot" id="d-bl2"></i><span class="k">Borderlands 2</span><span class="v" id="v-bl2"></span></div>
      <div class="row"><i class="dot" id="d-krieg"></i><span class="k">Krieg</span><span class="v" id="v-krieg"></span></div>
      <div class="row"><i class="dot" id="d-ver"></i><span class="k">BL2 Arsenal</span><span class="v" id="v-ver"></span></div>
    </div>

    <div class="actions">
      <button class="play" id="b-play">PLAY</button>
      <button class="primary" id="b-main">Install</button>
    </div>
    <div class="progress" id="prog"><i></i></div>

    <div class="more">
      <button id="b-check">Check for updates</button>
      <button id="b-file">Install from file...</button>
      <button id="b-game">Change game folder...</button>
      <button id="b-open">Open mod folder</button>
      <button id="b-launcher" style="display:none"></button>
      <button class="danger" id="b-uninstall">Uninstall</button>
    </div>
  </div>

  <div class="side">
    <h3>Patch notes</h3>
    <div class="notes" id="notes"><div style="color:var(--muted)">Checking...</div></div>
    <h3>Activity</h3>
    <div class="log" id="log"></div>
    <div class="foot"><span id="lv"></span><a id="gh">GitHub</a></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let S = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function newer(a, b) {
    const p = s => (String(s || '').match(/(\d+)\.(\d+)\.(\d+)/) || []).slice(1).map(Number);
    const x = p(a), y = p(b);
    if (!x.length) return false; if (!y.length) return true;
    for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
    return false;
  }
  function setRow(key, ok, html) {
    $('d-' + key).className = 'dot ' + (ok === true ? 'ok' : ok === false ? 'bad' : ok === 'warn' ? 'warn' : '');
    $('v-' + key).innerHTML = html; $('v-' + key).title = $('v-' + key).textContent;
  }
  function log(msg) {
    const d = document.createElement('div'); d.textContent = msg;
    $('log').appendChild(d); $('log').scrollTop = 1e9;
  }

  function render(s) {
    S = s;
    setRow('tps', s.tpsOk, s.tpsOk ? esc(s.tps) : 'Not found &mdash; use &ldquo;Change game folder&rdquo;');
    setRow('sdk', s.tpsOk ? s.sdkOk : null, !s.tpsOk ? '&mdash;' : s.sdkOk ? 'willow2-mod-manager installed'
      : 'Missing &mdash; <a data-url="https://github.com/bl-sdk/willow2-mod-manager/releases">download it</a>');
    setRow('bl2', !!s.bl2, s.bl2 ? esc(s.bl2) : 'Not found &mdash; the mod builds its textures and sounds from your BL2 install');

    const kt = {ready: [true, 'Ready &mdash; pick him on the character select screen'],
      standalone: ['warn', 'Using the separate KriegTPS mod (delete sdk_mods\\KriegTPS to use the built-in one)'],
      missing: [null, 'Built from your BL2 (Psycho Pack) the next time the game starts']}[s.krieg] || [null, '&mdash;'];
    setRow('krieg', s.tpsOk ? kt[0] : null, s.tpsOk ? kt[1] : '&mdash;');
    const inst = s.installed, latest = s.latest;
    const outdated = inst && latest && newer(latest, inst);
    const ahead = inst && latest && newer(inst, latest);
    let ver = !s.tpsOk ? '&mdash;' : inst ? 'v' + esc(inst) : 'Not installed';
    if (ahead) ver += ' &middot; newer than the released v' + esc(latest);
    else if (inst && latest && !outdated) ver += ' &middot; up to date';
    if (outdated) ver += ' &middot; <b style="color:var(--accent)">v' + esc(latest) + ' available</b>';
    setRow('ver', !s.tpsOk ? null : !inst ? false : outdated ? 'warn' : s.checked ? true : null, ver);

    const main = $('b-main');
    main.classList.toggle('hot', !inst || outdated);
    main.textContent = !inst ? (latest ? 'Install v' + latest : 'Install') : outdated ? 'Update to v' + latest : ahead ? 'Up to date' : 'Repair';
    main.disabled = s.busy || !s.tpsOk || ahead;
    $('b-play').disabled = !s.tpsOk;
    for (const id of ['b-check', 'b-file', 'b-game', 'b-uninstall', 'b-launcher']) $(id).disabled = s.busy;
    $('b-file').disabled = s.busy || !s.tpsOk;
    $('b-open').disabled = !s.tpsOk;
    $('b-uninstall').disabled = s.busy || !inst;
    $('b-launcher').style.display = s.launcherUpdate ? '' : 'none';
    $('b-launcher').textContent = 'Update launcher to v' + s.launcherUpdate;
    $('lv').textContent = 'Launcher v' + s.launcherVersion;

    if (!s.checked && !s.busy) $('notes').innerHTML = '<div style="color:var(--muted)">Not checked yet</div>';
    if (s.checked) {
      $('notes').innerHTML = '<div class="ver">v' + esc(latest) + '</div><ul>' +
        (s.notes || []).map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
    }
  }

  window.onEvent = ev => {
    if (ev.kind === 'state') render(ev.data);
    else if (ev.kind === 'log') log(ev.data);
    else if (ev.kind === 'progress') {
      const p = $('prog');
      p.style.visibility = ev.data < 0 ? 'hidden' : 'visible';
      p.firstElementChild.style.width = Math.max(0, ev.data) * 100 + '%';
    }
  };

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-url]');
    if (a) openUrl(a.dataset.url);
  });
  $('gh').onclick = () => openUrl('https://github.com/piercejonathan153-lab/BL2-Arsenal');
  $('b-play').onclick = () => play();
  $('b-main').onclick = () => installLatest();
  $('b-check').onclick = () => checkUpdates();
  $('b-file').onclick = () => installFile();
  $('b-game').onclick = () => chooseGame();
  $('b-open').onclick = () => openModFolder();
  $('b-uninstall').onclick = () => uninstall();
  $('b-launcher').onclick = () => updateLauncher();
  document.addEventListener('contextmenu', e => e.preventDefault());

  getState().then(s => { render(s); ready(); });
</script>
</body>
</html>
